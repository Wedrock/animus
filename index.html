<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#8b5cf6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tarefas">
  <title>Minhas Tarefas</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
  <script>
    // Aplica o tema escolhido antes de desenhar a página, para não piscar.
    try {
      var theme = (JSON.parse(localStorage.getItem('minhas-tarefas:v1')) || {}).settings || {};
      if (theme.theme === 'light' || theme.theme === 'dark') document.documentElement.dataset.theme = theme.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <h1 id="title">Hoje</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-theme" aria-label="Alternar modo escuro">🌙</button>
      <button class="icon-btn" id="btn-settings" aria-label="Configurações">⚙︎</button>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Adicionar">+</button>

  <nav class="tabs">
    <button data-tab="hoje" class="active"><span>☀︎</span>Hoje</button>
    <button data-tab="semana"><span>▦</span>Semana</button>
    <button data-tab="materias"><span>✎</span>Matérias</button>
    <button data-tab="estudar"><span>★</span>Estudar</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form"></form>
  </dialog>

  <div id="toast" role="status"></div>

  <script src="app.js"></script>
</body>
</html>
