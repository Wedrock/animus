<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Animus">
  <title>Animus</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Aplica o tema escolhido antes de desenhar a página, para não piscar.
    try {
      var theme = (JSON.parse(localStorage.getItem('minhas-tarefas:v1')) || {}).settings || {};
      if (theme.theme === 'light' || theme.theme === 'dark') document.documentElement.dataset.theme = theme.theme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span>Animus</span><i></i><small>Estudos e rotina</small></div>
    <div class="top-text">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title">Hoje</h1>
    </div>
    <nav class="topnav" aria-label="Seções">
      <button data-tab="hoje" class="active">Hoje</button>
      <button data-tab="semana">Semana</button>
      <button data-tab="materias">Matérias</button>
      <button data-tab="estudar">Estudar</button>
    </nav>
    <div class="topbar-actions">
      <button class="btn primary" id="btn-new"><span data-icon="plus"></span>Novo</button>
      <button class="icon-btn" id="btn-theme" aria-label="Alternar modo escuro"></button>
      <button class="icon-btn" id="btn-settings" aria-label="Configurações" data-icon="sliders"></button>
      <button class="userchip" id="btn-user" aria-label="Configurações da conta"><span class="avatar" id="avatar"></span><span id="username"></span></button>
    </div>
  </header>

  <main id="view"></main>

  <button class="fab" id="fab" aria-label="Adicionar" data-icon="plus"></button>

  <nav class="tabs">
    <button data-tab="hoje" class="active"><span data-icon="sun"></span>Hoje</button>
    <button data-tab="semana"><span data-icon="calendar"></span>Semana</button>
    <button data-tab="materias"><span data-icon="book"></span>Matérias</button>
    <button data-tab="estudar"><span data-icon="queue"></span>Estudar</button>
  </nav>

  <dialog id="modal">
    <form method="dialog" id="modal-form"></form>
  </dialog>

  <div id="gate" hidden>
    <div class="gate-box">
      <img src="icon.svg" alt="">
      <h1>Animus</h1>
      <p>Rotina da faculdade, do trabalho e da vida pessoal, e o que estudar primeiro.</p>
      <button class="btn primary" id="gate-signin" hidden>Entrar com Google</button>
      <p class="hint" id="gate-status" role="status"></p>
    </div>
  </div>

  <div id="toast" role="status"></div>

  <script src="firebase-config.js"></script>
  <script src="desktop.js"></script>
  <script src="app.js"></script>
  <script type="module" src="sync.js"></script>
</body>
</html>
